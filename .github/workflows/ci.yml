name: Connector CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - if: runner.os != 'Windows'
        run: go test -race ./...
      - if: runner.os == 'Windows'
        run: go test ./cmd/agentx-connect ./pkg/... ./internal/agentbridge/httptransport ./internal/agentbridge/mcpserver
      - if: runner.os == 'Windows'
        run: go test ./internal/agentbridge/hostauth ./internal/agentbridge/hostinstall -run Windows -count=1
